# SP: one fixed configuration for all top-level parallel regions.
# Target assumption: CPU IDs 0-63 represent 64 distinct physical cores,
# ordered across the target topology and all available to this process.
# Threads: 48. Spread rule: cpu(tid) = floor(tid * 64 / 48).
# This follows framework/j2025/j2025.cpp's SCATTER mapping.
# Selected CPUs: 0-2,4-6,8-10,...,60-62 (48 bits).
# This explicit mapping need not match a runtime's OMP_PROC_BIND=spread.
# Memory policy is external: launch with numactl --interleave=all.
# Offline requires OMP_PROC_BIND=false; see cfg/README.md.
# Format: function:source_pragma_line;threads;hex_cpu_mask
